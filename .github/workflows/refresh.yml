name: Refresh

# Rebuilds the database from Wikidata, Wikipedia and Commons, and commits what changed.
on:
  schedule:
    - cron: "17 4 1 * *" # monthly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go run ./scrape -out . -brand canon
      - name: Commit changes
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data: refresh from Wikidata and Wikipedia" -m "$(git diff --cached --shortstat)"
          git push
